<div class="col mt-4">
  <div class="timeline-body">
    {% for item in site.data.timeline %}
    <div class="timeline-item">
      <div class="content">
        <h2>{{ item.position }}</h2>
        <h5 class="organization">{{ item.organization }}</h5>
        {% if item.location %}
        <p class="location text-muted"><i class="fas fa-map-marker-alt"></i> {{ item.location }}</p>
        {% endif %}
        <h6 class="date">{{ item.from }} — {{ item.to }}</h6>
        <p>{{ item.description }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
